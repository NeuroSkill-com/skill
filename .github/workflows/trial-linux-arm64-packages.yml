name: Trial — Linux arm64 packages

# Proves out an aarch64 Linux .deb/.rpm before the release pipeline depends on
# one. Today `Release — Linux` builds x86_64 only, so there is no ARM Linux
# package at all, even though scripts/package-linux-system-bundles.sh already
# knows the aarch64 arch mapping.
#
# Deliberately `workflow_dispatch` only. It is NOT wired into the tag-driven
# release:
#   * an unproven job on the release path can fail a release, and
#   * a second full Linux build doubles the cost of every tag.
# Run it by hand, confirm the artifacts, and only then consider promoting it
# into release-linux.yml.
#
# This is also the Raspberry Pi (4/5, 64-bit OS) build: a Pi runs these exact
# aarch64 packages. The build runs inside a Debian container
# (scripts/build-linux-container.sh) so the binaries need the container's glibc,
# not the runner's: built on the Ubuntu 24.04 runner they would need 2.39 and
# refuse to start on Raspberry Pi OS Bookworm (2.36). The script also runs rlx's
# ISA portability check (no ungated above-ARMv8.0 instruction, so no SIGILL on
# a Pi 4) and `--version` under an emulated Cortex-A72 and A76. The .deb is
# then installed into debian:bookworm and debian:trixie arm64 containers to
# prove its dependencies resolve there. Artifacts are uploaded to the workflow
# run, never to a Release, so a trial cannot publish anything.
#
# Known arm64 delta from the x86_64 job:
#   * CUDA: the `linux` umbrella pulls rlx-cuda -> cudarc, which defaults to
#     `fallback-dynamic-loading` and dlopens libcuda at run time, so it builds
#     with no CUDA toolkit present and simply finds no device at run time
#     (the documented CUDA -> wgpu -> CPU fallback order).

on:
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          `app` builds the full product (frontend + daemon + tty + Tauri app),
          as a Raspberry Pi user would install it. `daemon` builds only the
          daemon and packages it in the app's place (faster).
        required: false
        default: app
        type: choice
        options:
          - app
          - daemon
      os:
        description: >-
          Debian release to build in. Sets the glibc floor: bookworm (2.36)
          runs on Raspberry Pi OS Bookworm and Trixie and Ubuntu 22.04+;
          trixie (2.41) only on Trixie and Ubuntu 25.04+.
        required: false
        default: bookworm
        type: choice
        options:
          - bookworm
          - trixie
      features:
        description: >-
          skill-daemon feature umbrella for scope=daemon (scope=app always
          uses the release recipe). `linux` mirrors the x86_64 release.
          Use `product` to isolate a failure from the GPU backends.
        required: false
        default: linux
        type: choice
        options:
          - linux
          - product

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trial-arm64:
    name: Trial — aarch64-unknown-linux-gnu packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/local/share/chromium /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v6

      - name: Confirm the runner really is arm64
        shell: bash
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          echo "dpkg arch : $arch"
          echo "uname -m  : $(uname -m)"
          if [[ "$arch" != "arm64" ]]; then
            echo "::error::Expected an arm64 runner, got '$arch'. This trial proves nothing on amd64."
            exit 1
          fi

      # Only to refresh Cargo.lock on the host; the build has its own toolchain.
      - name: Install Rust (lock refresh only)
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh rlx to main
        uses: ./.github/actions/refresh-rlx-main

      # `app` builds what a Raspberry Pi user installs: the same shared recipe
      # as the x86_64 release (frontend, then daemon → tty → Tauri app).
      # `daemon` is the quick path and packages the daemon in the app's place.
      - name: Build in debian:${{ inputs.os }} (aarch64)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-linux-container.sh \
            --target aarch64-unknown-linux-gnu \
            --image "debian:${{ inputs.os }}" \
            --scope "${{ inputs.scope }}" \
            --features "${{ inputs.features }}" \
            --no-volumes

      # Raspberry Pi OS follows Debian: Bookworm ships glibc 2.36, Trixie 2.41.
      # A binary needing a newer GLIBC_x.y symbol than the OS has will not start.
      - name: Check glibc floor (Raspberry Pi OS compatibility)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.os }}" in bookworm) max=2.36 ;; trixie) max=2.41 ;; esac
          for b in dist/linux-container/aarch64-unknown-linux-gnu/skill*; do
            need="$(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            echo "$(basename "$b") needs $need"
            if [[ "$(printf '%s\n' "${need#GLIBC_}" "$max" | sort -V | tail -1)" != "$max" ]]; then
              echo "::error::$(basename "$b") needs $need, newer than debian:${{ inputs.os }} (glibc $max)"
              exit 1
            fi
          done

      # The point of the trial: is the rpm well-formed, correctly versioned, and
      # does rpm's own dependency generator produce the OpenBLAS soname?
      - name: Inspect the rpm
        shell: bash
        run: |
          set -euo pipefail
          command -v rpm >/dev/null || sudo apt-get install -y -qq rpm >/dev/null
          out="dist/linux-container/aarch64-unknown-linux-gnu"
          rpm_file="$(find "$out" -name '*.rpm' | head -1)"
          deb_file="$(find "$out" -name '*.deb' | head -1)"
          if [[ -z "$rpm_file" || -z "$deb_file" ]]; then
            echo "::error::expected both a .deb and a .rpm under $out"
            ls -la "$out" || true
            exit 1
          fi

          echo "rpm : $rpm_file"
          echo "deb : $deb_file"
          rpm -qp --queryformat 'NAME=%{NAME}\nVERSION=%{VERSION}\nRELEASE=%{RELEASE}\nARCH=%{ARCH}\n' "$rpm_file"

          arch="$(rpm -qp --queryformat '%{ARCH}' "$rpm_file")"
          [[ "$arch" == "aarch64" ]] || { echo "::error::rpm ARCH is '$arch', expected aarch64"; exit 1; }

          # An RC must carry a tilde so it sorts BELOW the release it precedes.
          ver="$(rpm -qp --queryformat '%{VERSION}' "$rpm_file")"
          case "$ver" in
            *-*) echo "::error::rpm VERSION '$ver' contains '-', which rpm forbids"; exit 1 ;;
            *'\'*) echo "::error::rpm VERSION '$ver' contains a backslash"; exit 1 ;;
          esac
          if [[ "$(cat VERSION)" == *-rc.* && "$ver" != *'~'* ]]; then
            echo "::error::VERSION is an RC but rpm VERSION '$ver' has no '~' — upgrade ordering would invert"
            exit 1
          fi

          echo "--- requires ---"
          rpm -qp --requires "$rpm_file"
          rpm -qp --requires "$rpm_file" | grep -q 'libopenblas\.so\.0' \
            || echo "::warning::no libopenblas soname requirement was auto-generated"

      # Raspberry Pi OS is Debian plus Pi firmware/kernel, so a .deb whose
      # Depends resolve on debian:<release> arm64 installs on that Pi OS. Also
      # checks every shipped ELF finds all its shared libraries. Bookworm is
      # only expected to pass for a bookworm build.
      - name: Install the .deb on Debian arm64 (Raspberry Pi OS base)
        shell: bash
        run: |
          set -euo pipefail
          deb_file="$(find dist/linux-container/aarch64-unknown-linux-gnu -name '*.deb' | head -1)"
          releases="trixie"
          [[ "${{ inputs.os }}" == bookworm ]] && releases="bookworm trixie"
          for rel in $releases; do
            echo "── debian:$rel ──"
            docker run --rm --platform linux/arm64 -v "$PWD/$deb_file:/tmp/skill.deb:ro" "debian:$rel" bash -euc '
              apt-get update -qq
              apt-get install -y -qq /tmp/skill.deb >/dev/null
              missing=0
              for f in $(dpkg -L "$(dpkg-deb -f /tmp/skill.deb Package)"); do
                [[ -f "$f" && -x "$f" ]] || continue
                head -c4 "$f" | grep -q ELF || continue
                if ldd "$f" | grep "not found"; then echo "missing libs: $f"; missing=1; fi
              done
              /opt/neuroskill/skill-daemon --version
              exit $missing
            '
          done

      - name: Upload trial packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-trial-packages
          path: |
            dist/linux-container/aarch64-unknown-linux-gnu/*.deb
            dist/linux-container/aarch64-unknown-linux-gnu/*.rpm
          if-no-files-found: error
          retention-days: 14
