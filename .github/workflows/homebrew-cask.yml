name: Homebrew cask

# Keeps Casks/neuroskill.rb pinned to the latest *stable* GitHub release.
#
# Why a reconcile (not a step inside Release - Mac): a release published with the
# default GITHUB_TOKEN cannot, by design, trigger another workflow, so a
# `release: [released]` trigger would never fire. Instead this job runs after the
# mac release build completes (and on a weekly safety net), reads the current
# latest stable release, and commits the bump to main whenever the cask has
# drifted. RC builds are harmless: the reconcile always targets the latest
# *stable*, so an RC run finds no drift and does nothing.
#
# Why a direct commit (not a PR): the repo does not let GitHub Actions open pull
# requests, so `gh pr create` failed and the cask stayed behind (it sat at
# 0.0.129 after v0.1.0 shipped). The change is mechanical, only the version and
# the release asset's sha256 digest, so there is nothing for a review to catch.
on:
  workflow_run:
    workflows: ["Release - Mac"]
    types: [completed]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pin (e.g. 0.0.130); defaults to the latest stable release"
        required: false

permissions:
  contents: write # commit the bump to main

concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Homebrew cask
    runs-on: ubuntu-latest
    # For workflow_run, only proceed when the upstream build actually succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Reconcile cask to latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="--version ${{ github.event.inputs.version }}"
          fi
          node scripts/ci.mjs update-cask $ARGS

      - name: Commit the bump to main if the cask drifted
        run: |
          if git diff --quiet -- Casks/neuroskill.rb; then
            echo "Cask already current — nothing to do."
            exit 0
          fi

          VERSION="$(sed -n 's/^[[:space:]]*version "\(.*\)"/\1/p' Casks/neuroskill.rb | head -1)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/neuroskill.rb
          git commit -m "chore(homebrew): bump cask to v${VERSION}"

          # main may have moved since checkout (a release push, a merge): rebase
          # the one-file commit onto it and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Cask bumped to v${VERSION} on main."
              exit 0
            fi
            echo "::warning::push to main rejected (attempt ${attempt}); rebasing"
            git pull --rebase origin main
          done
          echo "::error::could not push the cask bump to main after 3 attempts"
          exit 1
