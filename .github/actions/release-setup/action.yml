name: Release setup
description: >-
  Shared release-job bootstrap: Rust toolchain + Swatinem/rust-cache (registry
  only; no compiler cache in release jobs, see the step comment), Node 22 + npm ci, optional
  frontend build, and platform hooks (mac tools, Windows protoc, Linux
  apt/bootstrap).

inputs:
  target:
    description: Rust target triple to install (e.g. aarch64-apple-darwin).
    required: true
  cache-key:
    description: Optional Swatinem/rust-cache shared-key (platform-specific).
    required: false
    default: ""
  cache-save-if:
    description: Passed to rust-cache save-if (use "always()" on Windows).
    required: false
    default: "true"
  skip-rust-toolchain:
    description: >-
      When "true", skip dtolnay/rust-toolchain. Implied when linux-deps is true
      (uses setup-rust-bootstrap-linux instead).
    required: false
    default: "false"
  macos-tools:
    description: When "true", brew-install protobuf + GNU ar and export AR.
    required: false
    default: "false"
  windows-protoc:
    description: When "true", install protoc via scripts/ci.mjs.
    required: false
    default: "false"
  linux-deps:
    description: >-
      When "true", install Tauri/system apt packages, then
      run setup-rust-bootstrap-linux (skips dtolnay/rust-toolchain).
    required: false
    default: "false"
  linux-apt-version:
    description: cache-apt-pkgs-action version key (bump to bust apt cache).
    required: false
    default: tauri-release-linux-v7
  build-frontend:
    description: When "true", run npm run build + verify:tauri:frontend after npm ci.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # ── Linux: apt (before Rust) ──────────────────────────────────────────────
    # NOTE: `packages:` below is a YAML folded scalar — every line in it is
    # literal text handed to apt, so a `#` does NOT start a comment there. Put
    # explanations here instead; a comment inside the block becomes a package
    # name and the step fails with `Unable to locate package #`.
    #
    # `rpm`      — rpmbuild, for the .rpm in package-linux-system-bundles.sh.
    # `dpkg-dev` — dpkg-shlibdeps, which derives the .deb Depends from the
    #              shipped ELFs. Present via build-essential on the hosted
    #              runners; named explicitly so a slimmer image cannot silently
    #              fall back to the incomplete hand-written dependency list.
    # Refresh the apt index first. The runner image's index can be days old and the
    # mirror drops superseded package versions; cache-apt-pkgs-action resolves exact
    # versions from that index, so without this it can request files that are gone
    # (404). The install then fails as a whole while the step still reports success,
    # and the build dies much later on a missing glib / libsoup / webkit
    # ("glib-2.0 was not found", v0.1.1 and v0.1.2-rc.1).
    - name: Refresh apt package index (Linux)
      if: inputs.linux-deps == 'true'
      shell: bash
      run: sudo apt-get update -o Acquire::Retries=5

    # The package list lives in one file so the cached install below and the
    # fallback after it cannot disagree. `rpm` is rpmbuild for the .rpm in
    # package-linux-system-bundles.sh; `dpkg-dev` is dpkg-shlibdeps, which derives
    # the .deb Depends from the shipped ELFs (named explicitly so a slimmer image
    # cannot silently fall back to the incomplete hand-written dependency list).
    - name: Read system package list (Linux)
      id: pkgs
      if: inputs.linux-deps == 'true'
      shell: bash
      run: echo "list=$(grep -v '^[[:space:]]*#' '${{ github.action_path }}/linux-apt-packages.txt' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

    # continue-on-error: this action can fail outright or, worse, report success
    # after a failed install. Either way the step below decides, by looking.
    - name: Cache + install system dependencies (Linux)
      id: apt
      if: inputs.linux-deps == 'true'
      continue-on-error: true
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: ${{ steps.pkgs.outputs.list }}
        version: ${{ inputs.linux-apt-version }}

    # Trust pkg-config, not the step above. If the libraries are missing, install
    # them directly (retrying, with the index refreshed each time), and fail here
    # with a clear message rather than minutes later inside a *-sys build script.
    - name: Ensure system libraries (Linux)
      if: inputs.linux-deps == 'true'
      shell: bash
      env:
        PKGS: ${{ steps.pkgs.outputs.list }}
        APT_OUTCOME: ${{ steps.apt.outcome }}
      run: |
        have() {
          local m
          for m in glib-2.0 gtk+-3.0 libsoup-3.0 webkit2gtk-4.1; do
            pkg-config --exists "$m" || return 1
          done
        }
        if have; then
          echo "system libraries present (cached install: $APT_OUTCOME)"
          exit 0
        fi
        echo "::warning::system libraries are missing after the cached apt step (outcome: $APT_OUTCOME); installing directly"
        for attempt in 1 2 3; do
          # shellcheck disable=SC2086  # PKGS is a space-separated list by design
          if sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --fix-missing $PKGS; then
            break
          fi
          echo "apt attempt $attempt failed"
          sleep $((attempt * 15))
        done
        if have; then
          echo "system libraries installed by the fallback"
          exit 0
        fi
        echo "::error::glib-2.0, gtk+-3.0, libsoup-3.0 or webkit2gtk-4.1 is still missing after 3 apt attempts"
        exit 1

    - name: Setup Rust bootstrap (Linux)
      if: inputs.linux-deps == 'true'
      uses: ./.github/actions/setup-rust-bootstrap-linux
      with:
        targets: ${{ inputs.target }}

    - name: Install Rust stable
      if: inputs.linux-deps != 'true' && inputs.skip-rust-toolchain != 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    # Registry cache only (cache-targets: false). Release builds deliberately run
    # without a compiler cache: they trigger on tags, and GitHub caches saved on a
    # tag ref are invisible to the next tag, while ci.yml's kache store (main) holds
    # dev/clippy-profile artifacts, not release-profile ones, so kache-action here
    # would cost a restore/save per job for ~0 hits. Do not add sccache/kache here
    # without a remote (S3) store that main can populate with release artifacts.
    - name: Cache Cargo registry + build artifacts
      uses: Swatinem/rust-cache@v2.9.1
      with:
        workspaces: ". -> src-tauri/target"
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.cache-save-if }}
        cache-targets: false
        cache-on-failure: false

    # Always build the latest rlx / rlx-models main (rewrites Cargo.lock pins).
    # Must run before the release job's `cargo tauri build --locked`.
    - name: Refresh rlx to main
      uses: ./.github/actions/refresh-rlx-main

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Update npm to latest
      shell: bash
      run: npm install -g npm@latest

    - name: Install JS dependencies
      shell: bash
      run: npm ci

    - name: Install protoc (macOS)
      if: inputs.macos-tools == 'true'
      shell: bash
      # Keep Apple's ar: GNU ar (binutils `gar`) writes archive members that
      # ld64 rejects as "not 8-byte aligned" when force-loaded (DuckDB).
      run: brew install protobuf

    - name: Install protoc (Windows)
      if: inputs.windows-protoc == 'true'
      shell: bash
      run: node scripts/ci.mjs install-protoc-windows

    - name: Build frontend
      if: inputs.build-frontend == 'true'
      shell: bash
      run: |
        set -euo pipefail
        npm run build
        npm run -s verify:tauri:frontend
