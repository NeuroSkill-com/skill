# cargo-audit ignore list — all transitive deps we cannot directly upgrade.
# Everything here is informational (unmaintained / unsound) — `--deny warnings`
# makes those fatal too, which is why the list is long. Anything genuinely
# exploitable gets upgraded instead of listed: on 2026-10-15 that meant rustls
# 0.23.46, event-listener 5.4.2, lru 0.18.5, and llmfit-core 1.1.17 (which took
# the whole serde_yml / noyalib YAML stack out of the graph rather than ignoring
# three advisories against it).

# Yanked crates — transitive deps we can't control.
[yanked]
enabled = false

[advisories]
ignore = [
    # The gtk-rs GTK3 "unmaintained" advisories (RUSTSEC-2024-0411 … 0420) were
    # withdrawn on 2026-08-14 and need no entry.

    # ── glib — unsound VariantStrIter, patched in >=0.20.0; GTK3 pins glib 0.18 ──
    # glib now comes from the eugenehp/gtk-rs-core fork (git), which RustSec does
    # not match, so this ignore is idle today. It stays because dropping the fork
    # puts crates.io glib 0.18 back in the graph, and that is still affected.
    "RUSTSEC-2024-0429", # glib

    # ── Other unmaintained transitive deps ────────────────────────────────────
    "RUSTSEC-2024-0370", # proc-macro-error (via gtk3-macros)
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2025-0141", # bincode

    # ── zbus stack — folded into `zbus` 6.0.0, so there is nothing to upgrade ──
    # zvariant, zvariant_derive and zbus_names stopped being published as
    # standalone crates on 2026-10-16; all three advisories carry
    # `patched = []` and say to migrate to zbus >= 6.0.0 (its `wire` / `names`
    # modules). We are on zbus 5.18.0 (notify-rust, tauri-plugin-opener,
    # tauri-plugin-single-instance, xcap) and zbus 4.4.0 (secret-service, via
    # keyring), so reaching 6.0.0 is up to those five upstreams. D-Bus, so this
    # whole stack is Linux-only. cargo-deny does not need these: its
    # `unmaintained = "workspace"` already scopes the lint to our own crates.
    "RUSTSEC-2026-0370", # zvariant unmaintained — merged into zbus 6.0.0
    "RUSTSEC-2026-0371", # zbus_names unmaintained — merged into zbus 6.0.0
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained — merged into zbus 6.0.0

    # ── unsafe-libyaml — unmaintained, no patched release ────────────────────
    # Reached as neurorvq-rs 0.2 -> serde_yaml 0.9 (itself deprecated) ->
    # unsafe-libyaml. `patched = []`, so there is nothing to upgrade to short of
    # neurorvq-rs moving off serde_yaml. It used to arrive by a second road as
    # well — llmfit-core 0.9 -> serde_yml -> unsafe-libyaml — and that one is
    # gone as of llmfit-core 1.1.17, which also removed serde_yml's own
    # RUSTSEC-2025-0068 and noyalib's RUSTSEC-2026-0333 from this list.
    "RUSTSEC-2024-0449", # unsafe-libyaml — unmaintained (serde_yaml's backend)
]
