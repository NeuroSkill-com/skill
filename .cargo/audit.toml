# cargo-audit ignore list — all transitive deps we cannot directly upgrade.
# Everything here is informational (unmaintained / unsound) — `--deny warnings`
# makes those fatal too, which is why the list is long. Anything genuinely
# exploitable gets upgraded instead of listed: on 2026-10-15 that meant rustls
# 0.23.46, event-listener 5.4.2, lru 0.18.5, and llmfit-core 1.1.17 (which took
# the whole serde_yml / noyalib YAML stack out of the graph rather than ignoring
# three advisories against it).

# Yanked crates — transitive deps we can't control.
[yanked]
enabled = false

[advisories]
ignore = [
    # ── gtk-rs GTK3 family — unmaintained, no GTK4 upgrade path until Tauri migrates ──
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys

    # ── glib — unsound VariantStrIter, patched in >=0.20.0; blocked by gtk3 above ──
    "RUSTSEC-2024-0429", # glib

    # ── Other unmaintained transitive deps ────────────────────────────────────
    "RUSTSEC-2021-0139", # ansi_term (via structopt/clap2 in iroh test clients)
    "RUSTSEC-2023-0089", # atomic-polyfill (via heapless 0.7 in iroh stack)
    "RUSTSEC-2024-0370", # proc-macro-error (via gtk3-macros)
    "RUSTSEC-2024-0375", # atty unmaintained (via structopt/clap2 in iroh test clients)
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0119", # number_prefix
    "RUSTSEC-2025-0134", # rustls-pemfile (via oura-api/reqwest 0.11)
    "RUSTSEC-2025-0141", # bincode

    # ── Unsound warnings in legacy transitive deps ────────────────────────────
    "RUSTSEC-2021-0145", # atty potential unaligned read (legacy clap2 chain)

    # ── rand — unsound with custom logger using rand::rng(); transitive dep ──
    "RUSTSEC-2026-0097", # rand (0.7.3 via tauri/phf, 0.8.5 via keyring/emotiv/etc.)

    # ── unsafe-libyaml — unmaintained, no patched release ────────────────────
    # Reached as neurorvq-rs 0.2 -> serde_yaml 0.9 (itself deprecated) ->
    # unsafe-libyaml. `patched = []`, so there is nothing to upgrade to short of
    # neurorvq-rs moving off serde_yaml. It used to arrive by a second road as
    # well — llmfit-core 0.9 -> serde_yml -> unsafe-libyaml — and that one is
    # gone as of llmfit-core 1.1.17, which also removed serde_yml's own
    # RUSTSEC-2025-0068 and noyalib's RUSTSEC-2026-0333 from this list.
    "RUSTSEC-2024-0449", # unsafe-libyaml — unmaintained (serde_yaml's backend)

    # ── Mirrors of deny.toml's reviewed ignores ─────────────────────────────
    # cargo-deny reads deny.toml and cargo-audit reads this file, so a decision
    # recorded in one is invisible to the other — and CI runs both. These three
    # are the same calls, with the same reasoning, as the `[advisories] ignore`
    # entries in deny.toml; change them together or the audit job disagrees
    # with the deny job.
    "RUSTSEC-2026-0194", # quick-xml <0.41 pinned by tauri/plist; trusted local XML only
    "RUSTSEC-2026-0195", # quick-xml <0.41 pinned by tauri/plist; trusted local XML only
    "RUSTSEC-2024-0437", # protobuf <3.7.2, build-only protoc codegen; not in the shipped binary

]
