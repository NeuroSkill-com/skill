[package]
name = "skill-bids"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Export NeuroSkill recordings as a BIDS-EEG dataset over a chosen time range"

[dependencies]
bbtree = { workspace = true }
anyhow = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
skill-data = { path = "../skill-data" }
bids-core     = { workspace = true }
bids-io       = { workspace = true }
bids-eeg      = { workspace = true }
bids-validate = { workspace = true }

[features]
# Read recordings stored as Parquet (`storage_format = "parquet"`).
parquet = ["skill-data/parquet"]

[dev-dependencies]
tempfile = "3"
bids-layout = { workspace = true }

[lints]
workspace = true
