[package]
name = "skill-label-index"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Cross-modal label HNSW indices (text, context, EEG) — extracted workspace crate"
build = "build.rs"

[features]
# HNSW is the runtime default. Enable `turboquant-index` for the TurboQuant
# backend; turbovec 1.1 carries no dependencies and needs no BLAS of its own,
# but `accelerate-src` stays in this feature because it is the graph's only
# BLAS provider for `ndarray`'s `blas` feature on macOS — see the
# `extern crate accelerate_src` comment in src/lib.rs before removing it.
default = []
turboquant-index = ["dep:turbovec", "dep:accelerate-src"]

[dependencies]
skill-constants = { path = "../skill-constants" }
skill-commands  = { path = "../skill-commands" }
skill-data      = { path = "../skill-data" }
fast-hnsw  = "1.0.1"
serde      = { version = "1", features = ["derive"] }
turbovec   = { version = "1.1.2", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
accelerate-src = { version = "0.3", optional = true }

[lints]
workspace = true
