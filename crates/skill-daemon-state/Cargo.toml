[package]
name = "skill-daemon-state"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Shared state types for skill-daemon — extracted for parallel compilation"

[features]
# Opt-in: builds the model-, GPU- and measurement-dependent integration tests
# listed below. Off by default so `cargo test --workspace` does not link ~60 MB
# of test executables that are ignored or skip themselves without cached models.
# `cargo test-slow` (see .cargo/config.toml) turns this on for every crate.
slow-tests = []
# Text embeddings run on the RLX runtime via `rlx-embed`
# (RlxBertModel / RlxNomicModel — BGE / Nomic / E5 families). The tier
# suffixes below add GPU backends; the base feature is the CPU baseline.
# Product builds: enable one OS umbrella (`apple` / `linux` / `windows`).
default = ["llm"]
# Opt-in: builds the benchmark / eval binaries below. Off by default so that
# `cargo test --workspace` does not link four ~80 MB tools nobody is running.
bench-tools = []
llm = ["skill-llm/llm"]
apple   = ["text-embeddings-rlx-metal", "text-embeddings-rlx-wgpu"]  # Metal → wgpu → CPU; no MLX
linux   = ["text-embeddings-rlx-wgpu", "text-embeddings-rlx-cuda"]
windows = ["text-embeddings-rlx-wgpu", "text-embeddings-rlx-cuda"]
text-embeddings-rlx = ["dep:skill-accel", "dep:hf-hub", "dep:rlx", "dep:rlx-models", "dep:tokenizers", "rlx-models/embed", "rlx-models/bert", "rlx-models/nomic"]
text-embeddings-rlx-metal = ["text-embeddings-rlx", "rlx?/metal", "rlx?/blas-accelerate", "rlx-models?/metal"]
text-embeddings-rlx-mlx   = ["text-embeddings-rlx", "rlx?/mlx", "rlx?/blas-accelerate", "rlx-models?/mlx"]
text-embeddings-rlx-cuda  = ["text-embeddings-rlx", "rlx?/cuda", "rlx-models?/cuda"]
text-embeddings-rlx-rocm  = ["text-embeddings-rlx", "rlx?/rocm", "rlx-models?/rocm"]
text-embeddings-rlx-wgpu  = ["text-embeddings-rlx", "rlx?/gpu", "rlx-models?/gpu"]

[dependencies]
skill-accel = { path = "../skill-accel", optional = true }
bbtree = { workspace = true }
# For the skill-retrieval eval bin: ranking + prompt-mode rendering.
skill-skills = { path = "../skill-skills" }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
base64     = { workspace = true }
dirs       = "7"
hf-hub     = { version = "0.5", default-features = false, features = ["ureq"], optional = true }
hex        = "0.4"
rand       = "0.10"
rlx        = { workspace = true, optional = true, features = ["cpu"] }
rlx-models = { workspace = true, optional = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = "0.11"
tokio      = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
tracing    = "0.1"

skill-constants     = { path = "../skill-constants" }
skill-daemon-common = { path = "../skill-daemon-common" }
skill-data          = { path = "../skill-data" }
skill-devices       = { path = "../skill-devices" }
skill-eeg           = { path = "../skill-eeg" }
skill-iroh          = { path = "../skill-iroh" }
skill-label-index   = { path = "../skill-label-index", features = ["turboquant-index"] }
skill-llm           = { path = "../skill-llm" }
skill-lsl           = { path = "../skill-lsl" }
skill-settings      = { path = "../skill-settings" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# Benchmark / eval tools: run with `cargo run --features bench-tools --bin <name>`.
# They have no unit tests (`test = false`) and sit behind `bench-tools`, which
# nothing enables by default — `required-features` on an existing feature would
# not do, since the app turns those on workspace-wide.
[[bin]]
name = "bench_skill_prompt"
path = "src/bin/bench_skill_prompt.rs"
test = false
required-features = ["bench-tools"]

[[bin]]
name = "bench_text_embeddings"
path = "src/bin/bench_text_embeddings.rs"
test = false
required-features = ["bench-tools"]

[[bin]]
name = "eval_skill_retrieval"
path = "src/bin/eval_skill_retrieval.rs"
test = false
required-features = ["bench-tools"]

[[test]]
name = "rlx_semantic"
path = "tests/rlx_semantic.rs"
required-features = ["slow-tests"]
