[package]
autotests = false
name = "skill-settings"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Persistent configuration types and disk I/O — extracted workspace crate"

[dependencies]
skill-constants    = { path = "../skill-constants" }
skill-eeg          = { path = "../skill-eeg" }
skill-tts          = { path = "../skill-tts" }
skill-asr          = { path = "../skill-asr" }
skill-llm          = { path = "../skill-llm" }

skill-data         = { path = "../skill-data" }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
dirs               = "7"
# keyring 4 `v1` (default feature) picks the platform store itself: Keychain
# on macOS, Credential Manager on Windows (same `user.service` target names as
# 3.x), Secret Service via pure-Rust zbus on Linux (3.x's persistent mode also
# wrote there, so existing secrets stay readable).
keyring            = "4.2"
tracing            = "0.1"

[dev-dependencies]
tempfile           = "3"

[features]
default = []
llm     = []

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
