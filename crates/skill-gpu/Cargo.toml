[package]
name = "skill-gpu"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Cross-platform GPU utilisation and memory stats (macOS IOKit, Linux/Windows via llmfit-core)"

[dependencies]
serde = { workspace = true }
sysinfo    = "0.40"
libc       = "0.2"

# Linux/Windows GPU stats only (`stats::non_macos`); macOS reads IOKit directly.
[target.'cfg(not(target_os = "macos"))'.dependencies]
llmfit-core = "1.1.17"

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
