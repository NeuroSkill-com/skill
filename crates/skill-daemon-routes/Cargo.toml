[package]
name = "skill-daemon-routes"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "HTTP route modules extracted from skill-daemon for parallel compilation"

[features]
default = []

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
serde_json = { workspace = true }

skill-daemon-state = { path = "../skill-daemon-state", default-features = false }
skill-iroh = { path = "../skill-iroh" }

[lints]
workspace = true
