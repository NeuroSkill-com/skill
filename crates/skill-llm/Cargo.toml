[package]
name = "skill-llm"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "LLM inference engine for NeuroSkill — extracted workspace crate"

[features]
default    = []

# ── Backend feature flags ─────────────────────────────────────────────────────
# `llm` is a marker auto-enabled by any backend — it gates the shared
# engine scaffolding (state, protocol, handlers, tool orchestration).
#
# Per-platform RLX backend variants (mirror rlx's own naming):
#   macOS:        llm-rlx-metal | llm-rlx-mlx                 (also brings BLAS Accelerate)
#   Linux:        llm-rlx-cuda  | llm-rlx-rocm | llm-rlx-wgpu | llm-rlx-cpu
#   Windows:      llm-rlx-cuda  | llm-rlx-wgpu | llm-rlx-cpu
# `llm-rlx-cpu` is the portable fallback (no GPU dependency; relies on
# rlx-cpu's scalar gemm or system BLAS if linked separately).
#
# Product builds should enable one OS umbrella (`apple` / `linux` / `windows`)
# rather than listing leaf backends. Linux/Windows compile CUDA + wgpu; missing
# NVIDIA drivers fall back at runtime (CUDA → wgpu → CPU).
apple   = ["llm-rlx-metal", "llm-rlx-mlx"]
linux   = ["llm-rlx-wgpu", "llm-rlx-cuda"]
windows = ["llm-rlx-wgpu", "llm-rlx-cuda"]
llm                = []
# Base rlx feature pulls cpu dispatch so the runtime always has at least
# one usable target. GPU-flavor features add their backend on top.
# `rlx-models/runner` gates the `run` module (LmRunner, Qwen3Runner, auto_*,
# ChatTemplate/ChatMessage). rlx-models 0.2.9+ made model families opt-in, so
# this must be enabled explicitly now (was default in 0.2.5).
llm-rlx       = ["llm", "dep:rlx", "dep:rlx-models", "rlx-models?/runner", "rlx-models?/qwen35-vlm", "dep:rlx-minicpm5", "dep:rlx-minimax", "dep:rlx-nemotron", "dep:rlx-gemma", "dep:image", "rlx?/cpu"]
llm-rlx-cpu   = ["llm-rlx"]
llm-rlx-metal = ["llm-rlx", "rlx?/metal", "rlx?/blas-accelerate", "rlx-models?/metal", "rlx-minicpm5?/metal", "rlx-minimax?/metal", "rlx-nemotron?/metal", "rlx-gemma?/metal"]
llm-rlx-mlx   = ["llm-rlx", "rlx?/mlx", "rlx?/blas-accelerate", "rlx-models?/mlx", "rlx-minicpm5?/mlx", "rlx-minimax?/mlx", "rlx-nemotron?/mlx", "rlx-gemma?/mlx"]
llm-rlx-cuda  = ["llm-rlx", "rlx?/cuda", "rlx-models?/cuda", "rlx-minicpm5?/cuda", "rlx-minimax?/cuda", "rlx-nemotron?/cuda", "rlx-gemma?/cuda"]
llm-rlx-rocm  = ["llm-rlx", "rlx?/rocm", "rlx-models?/rocm", "rlx-minicpm5?/rocm", "rlx-minimax?/rocm", "rlx-nemotron?/rocm", "rlx-gemma?/rocm"]
llm-rlx-wgpu  = ["llm-rlx", "rlx?/gpu", "rlx-models?/gpu", "rlx-minicpm5?/gpu", "rlx-minimax?/gpu", "rlx-nemotron?/gpu", "rlx-gemma?/gpu"]

# ── Local-model discovery + mlx-community packed load ─────────────────────────
# Surface GGUFs + mlx-community safetensors downloaded by other apps (LM Studio,
# Ollama, Lemonade, HF / MLX cache) via rlx-models' `weights_discover` scanner,
# and load mlx-community packs via `Qwen3Runner::from_mlx_packed`.
# Requires a local (or post-0.2.13) rlx-models that ships those APIs — keep OFF
# the OS umbrellas until the Cargo.lock pin is bumped. Opt in with
# `--features apple,llm-model-discovery` (and `scripts/rlx local` while
# developing against sibling ../rlx-models).
llm-model-discovery = ["llm-rlx"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
glob = "0.3"
skill-constants = { path = "../skill-constants" }
skill-data      = { path = "../skill-data" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { workspace = true }
axum       = { version = "0.8", features = ["ws"] }
tokio      = { version = "1", features = ["full"] }
async-stream = "0.3"
log        = "0.4"
base64 = { workspace = true }
ureq       = { version = "3", features = ["native-tls", "json"] }
either     = "1"
hf-hub     = "0.5"
skill-tools  = { path = "../skill-tools", default-features = false }
skill-skills = { path = "../skill-skills" }
sha2       = "0.10"
hex        = "0.4"
rlx        = { workspace = true, optional = true, features = ["cpu", "gguf"] }
rlx-models = { workspace = true, optional = true }
rlx-minicpm5 = { workspace = true, optional = true, features = ["tokenizer"] }
rlx-minimax  = { workspace = true, optional = true }
rlx-nemotron = { workspace = true, optional = true }
rlx-gemma    = { workspace = true, optional = true, features = ["tokenizer"] }
image      = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"], optional = true }

[build-dependencies]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
