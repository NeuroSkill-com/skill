[package]
name = "skill-viz3d"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
description = "The app's 3D views (electrode head, search graph, UMAP) on threers, compiled to WebAssembly for the web view"
publish = false

# Its own workspace, kept out of the root one: only the wasm build and its own
# headless tests compile threers, so `cargo clippy --workspace` and the Rust CI
# jobs do not pay for it.  Built by scripts/build-viz3d.sh into src/lib/viz3d/pkg.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `render` is the wgpu renderer and the scene graph; `webgl` adds the WebGL2
# fallback for web views without WebGPU (WebKitGTK on Linux, older macOS).
# The rest of the defaults (audio, captions, a winit sketch window, JPEG) are
# not used.  Built with `--cfg threers_no_js_bindings`, which leaves out
# threers' own ~1,200 JS exports — this crate exports only its own.
threers = { version = "0.1.0", default-features = false, features = ["render"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
threers = { version = "0.1.0", default-features = false, features = ["render", "webgl"] }
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(threers_no_js_bindings)"] }
