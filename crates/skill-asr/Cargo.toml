[package]
name = "skill-asr"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "ASR + VAD voice-input engine for NeuroSkill — rlx-whisper (ASR) + rlx-vad (Silero) + cpal mic capture"
build = "build.rs"

[features]
default = []
# OS umbrellas — product builds pass one of these (via skill-daemon).
# Leaf `asr-*` features remain for targeted tests.
apple   = ["asr-metal", "asr-mlx"]
linux   = ["asr-cuda", "asr-wgpu"]
windows = ["asr-cuda", "asr-wgpu"]
# `asr` wires up the real engine on every desktop OS: Whisper / Qwen3-ASR /
# Voxtral / FunASR / Nemotron / rlx-asr + Silero VAD + cpal mic capture.
asr = [
    "dep:cpal",
    "dep:hf-hub",
    "dep:rlx-whisper",
    "dep:rlx-vad",
    "dep:rlx-runtime",
    "dep:rlx-qwen3-asr",
    "dep:rlx-voxtral",
    "dep:rlx-funasr",
    "dep:rlx-nemotron-asr",
    "dep:rlx-asr",
]
# GPU backends (inert unless `asr` is also on). Names mirror rlx-runtime.
asr-metal = ["asr", "rlx-whisper?/metal", "rlx-vad?/metal", "rlx-runtime?/metal", "rlx-qwen3-asr?/metal", "rlx-voxtral?/metal", "rlx-funasr?/metal", "rlx-nemotron-asr?/metal", "rlx-asr?/metal"]
asr-mlx   = ["asr", "rlx-whisper?/mlx",   "rlx-vad?/mlx",   "rlx-runtime?/mlx",   "rlx-qwen3-asr?/mlx",   "rlx-voxtral?/mlx",   "rlx-funasr?/mlx",   "rlx-nemotron-asr?/mlx",   "rlx-asr?/mlx"]
asr-cuda  = ["asr", "rlx-whisper?/cuda",  "rlx-vad?/cuda",  "rlx-runtime?/cuda",  "rlx-qwen3-asr?/cuda",  "rlx-voxtral?/cuda",  "rlx-funasr?/cuda",  "rlx-nemotron-asr?/cuda",  "rlx-asr?/cuda"]
asr-wgpu  = ["asr", "rlx-whisper?/gpu",   "rlx-vad?/gpu",   "rlx-runtime?/gpu",   "rlx-qwen3-asr?/gpu",   "rlx-voxtral?/gpu",   "rlx-funasr?/gpu",   "rlx-nemotron-asr?/gpu",   "rlx-asr?/gpu"]
asr-rocm  = ["asr", "rlx-whisper?/rocm",  "rlx-vad?/rocm",  "rlx-runtime?/rocm",  "rlx-qwen3-asr?/rocm",  "rlx-voxtral?/rocm",  "rlx-funasr?/rocm",  "rlx-nemotron-asr?/rocm",  "rlx-asr?/rocm"]

[dependencies]
anyhow          = { workspace = true }
skill-constants = { path = "../skill-constants" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
dirs       = "6"
hf-hub     = { version = "0.5", optional = true }
cpal       = { version = "0.17", optional = true }

# Platform baseline GPU features (extra backends via asr-* Cargo features above).
# macOS: Metal. Linux/Windows: CUDA + wgpu. Runtime picks the first available.
[target.'cfg(target_os = "macos")'.dependencies]
rlx-whisper      = { workspace = true, features = ["tokenizer", "metal"], optional = true }
rlx-vad          = { workspace = true, features = ["silero", "metal"], optional = true }
rlx-runtime      = { workspace = true, features = ["cpu", "metal"], optional = true }
rlx-qwen3-asr    = { workspace = true, features = ["tokenizer", "metal"], optional = true }
rlx-voxtral      = { workspace = true, features = ["tokenizer", "metal"], optional = true }
rlx-funasr       = { workspace = true, features = ["metal"], optional = true }
rlx-nemotron-asr = { workspace = true, features = ["tokenizer", "metal"], optional = true }
rlx-asr          = { workspace = true, features = ["metal"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
rlx-whisper      = { workspace = true, features = ["tokenizer", "cuda", "gpu"], optional = true }
rlx-vad          = { workspace = true, features = ["silero", "cuda", "gpu"], optional = true }
rlx-runtime      = { workspace = true, features = ["cpu", "cuda", "gpu"], optional = true }
rlx-qwen3-asr    = { workspace = true, features = ["tokenizer", "cuda", "gpu"], optional = true }
rlx-voxtral      = { workspace = true, features = ["tokenizer", "cuda", "gpu"], optional = true }
rlx-funasr       = { workspace = true, features = ["cuda", "gpu"], optional = true }
rlx-nemotron-asr = { workspace = true, features = ["tokenizer", "cuda", "gpu"], optional = true }
rlx-asr          = { workspace = true, features = ["cuda", "gpu"], optional = true }

[lints]
workspace = true
