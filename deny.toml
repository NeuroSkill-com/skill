# ── cargo-deny configuration ──────────────────────────────────────────────────
# Run: cargo deny check -A no-license-field -A parse-error -A license-not-encountered
# CI:  cargo deny --workspace check -A no-license-field -A parse-error -A license-not-encountered

[graph]
targets = []
all-features = false

# ── Advisories ────────────────────────────────────────────────────────────────
# cargo-deny 0.16+ schema (PR#611):
#   - vulnerability: removed — vulnerabilities are always denied unless ignored
#   - unmaintained: scope filter ("all" | "workspace" | "transitive" | "none")
#   - yanked: still a lint level ("deny" | "warn" | "allow")
#   - notice: removed
[advisories]
# "workspace" = error only if OUR OWN crates have unmaintained advisories;
# transitive dependency advisories are reported but don't fail CI.
# Equivalent to the old (removed) unmaintained = "warn".
unmaintained = "workspace"
yanked       = "warn"
ignore = [
    # NOTE: gtk 0.18.2 (RUSTSEC-2024-0415, informational "unmaintained", pulled
    # transitively by tauri → tray-icon → libappindicator) needs no entry here.
    # `unmaintained = "workspace"` above already scopes that lint to our own
    # crates, so a transitive unmaintained advisory cannot fail the check — and
    # an ignore that never matches makes cargo-deny fail with
    # `advisory-not-detected`. Still tracked for when Tauri drops GTK3.
    # lru 0.12.5 — IterMut unsoundness, patched in >=0.16.3.
    # Pulled transitively; not directly used by workspace code paths that call IterMut.
    #
    # anyhow's RUSTSEC-2026-0190 (downcast_mut unsoundness) is fixed by upgrading
    # to anyhow >=1.0.103 (done in Cargo.lock), so it is NOT ignored here.
    #
    # quick-xml 0.30/0.37/0.39 — DoS advisories, fixed in >=0.41.0. Pinned by
    # tauri/plist (build-time codegen + macOS Info.plist parsing); reaching 0.41
    # needs a Tauri major bump. Inputs are trusted local config/plist, not
    # attacker-controlled network XML.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml <0.41 pinned transitively by tauri/plist; trusted local XML only" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml <0.41 pinned transitively by tauri/plist; trusted local XML only" },
    # DISABLED with rlx-tiny-tts (reshape bug on Metal + MLX). The onnx → protoc
    # codegen chain (protobuf 1.x, tempdir → remove_dir_all) only entered the
    # graph via rlx-tiny-tts; with that engine commented out no crate matches
    # these advisories, so cargo-deny warns `advisory-not-detected`. Re-enable
    # both lines together with rlx-tiny-tts in crates/skill-tts/Cargo.toml.
    #   protobuf 1.7.5 — recursion DoS, fixed in >=3.7.2 (build-only, never shipped)
    { id = "RUSTSEC-2024-0437", reason = "build-only protoc codegen via onnx/rlx-tiny-tts; not in shipped binary" },
    # zip <9.0.0 — three advisories against the extraction APIs
    # (`ZipArchive::extract` / `ZipStreamReader::extract`), all fixed in 9.0.0.
    # Everything we own is on 9.x as of 2026-10-25: the workspace `zip`
    # (root Cargo.toml) and the rlx / rlx-models archive readers (rlx-pkg,
    # rlx-dduf, rlx-asr, rlx-funasr, rlx-kittentts, rlx-kittentts2,
    # rlx-voxtral-tts). Two copies we do not control are left, and neither is
    # reachable in a way these advisories describe:
    #
    #   zip 4.6.1 — tauri-plugin-updater, declared
    #     `target = cfg(target_os = "windows")`. This is the one place in the
    #     whole graph that actually calls `extract()` (`updater.rs::extract_zip`,
    #     behind its `zip` feature) — and all three advisories are about Unix
    #     semantics: SUID/SGID bits preserved from `external_attributes`, and
    #     symlinks whose targets escape the destination. Neither exists on the
    #     only platform this copy is ever compiled for. The bytes reaching
    #     `extract()` come from `Update::download`, which verifies their minisign
    #     signature against the pinned pubkey before returning them, so the
    #     archive is our own signed `.nsis.zip`, not attacker-controlled input.
    #     There is nothing to upgrade to: even tauri-plugin-updater
    #     3.0.0-alpha.3 still requires `zip ^4`.
    #
    #   zip 0.6.6 — `npyz`'s `npz` feature, reached through rlx-mlx-io. npyz
    #     0.9.1, its newest release, still requires `zip ^0.6`. rlx-mlx-io reads
    #     `.npz` members by name through `NpzArchive` and never extracts to disk.
    #
    # Mirrored in .cargo/audit.toml — cargo-audit reads that file, not this one,
    # and CI runs both.
    { id = "RUSTSEC-2026-0367", reason = "zip <9 extract() APIs; the only extract() caller left is tauri-updater's Windows-only zip 4 (Unix-only issue, signature-verified archive); npyz's zip 0.6 never extracts" },
    { id = "RUSTSEC-2026-0368", reason = "zip <9 extract() APIs; the only extract() caller left is tauri-updater's Windows-only zip 4 (Unix-only issue, signature-verified archive); npyz's zip 0.6 never extracts" },
    { id = "RUSTSEC-2026-0369", reason = "zip <9 extract() APIs; the only extract() caller left is tauri-updater's Windows-only zip 4 (Unix-only issue, signature-verified archive); npyz's zip 0.6 never extracts" },
    # NOTE: noyalib's RUSTSEC-2026-0333 (YAML budget DoS) needed an entry here
    # until 2026-10-15, when llmfit-core 0.9 -> 1.1.17 replaced serde_yml with
    # yaml_serde and took serde_yml and noyalib out of the graph with it. Do
    # NOT re-add it speculatively: cargo-deny fails on an ignore that matches
    # nothing (`advisory-not-detected`), so a listed-but-absent advisory breaks
    # the check as surely as an unlisted-but-present one.
    #   remove_dir_all 0.5.3 — TOCTOU, fixed in >=0.8.0 (build-only, via tempdir 0.3.7)
    # { id = "RUSTSEC-2023-0018", reason = "build-only protoc codegen via onnx/rlx-tiny-tts; not in shipped binary" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
# cargo-deny 0.16+ removed `unlicensed` and `copyleft` (PR#611).
# Crates not matching an `allow`ed license are denied by default.
[licenses]
# Third-party crates in this workspace include several with missing/legacy
# license metadata. Keep SPDX allow-list enforcement, but avoid noisy
# warnings for unmatched allow entries and feature-gated optional deps.
unused-allowed-license = "allow"
unused-license-exception = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT-0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "LicenseRef-AI100",
    # bzip2/libbz2 license (BSD-like permissive, valid SPDX identifier).
    # Used by libbz2-rs-sys, pulled transitively via the zip crate.
    "bzip2-1.0.6",
]
