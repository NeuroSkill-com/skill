# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Duplicate versions are pervasive in transitive deps — the Tauri/windows-*
# stack alone carries four generations of the windows_* sys crates — and we do
# not control any of them, so the output is noise rather than something to act
# on. Keep the check green for what IS actionable: advisories, licenses, sources.
multiple-versions = "allow"
wildcards         = "allow"
highlight         = "all"

# No `skip` list, deliberately. `skip` only suppresses `multiple-versions`
# diagnostics, and that lint is `allow`ed above, so every entry was inert — it
# could not silence anything, and any entry whose exact version left the graph
# produced a `unmatched-skip` warning instead. The list had rotted to nine of
# those (zip@2.4.2 and zip@7.2.0 after the zip 9 upgrade, seven windows_*@0.48.5
# after the windows-sys stack moved on), which is noise in every pre-push run.
#
# If `multiple-versions` is ever flipped to "warn"/"deny", rebuild the list then,
# from that run's actual output — do not restore the old one, which was already
# wrong for the current graph.

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# An allowed source that nothing matched cannot be a reliable signal in this
# repo: `scripts/rlx local` path-patches rlx + rlx-models onto sibling
# checkouts, so the two MIT-RLX entries below are unmatched on a developer
# machine and matched in CI, from the same file. Reporting them just trains
# people to ignore the sources check. Entries that go genuinely dead get
# deleted instead — `eugenehp/btleplug.git` was removed on 2026-10-25, the
# shim having been retired on 2026-10-15 (`cargo tree -i btleplug` finds
# nothing), because a stale `allow-git` entry quietly keeps permitting that
# repo.
unused-allowed-source = "allow"
unknown-registry = "deny"
unknown-git      = "warn"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/eugenehp/gtk-rs-core.git",
    "https://github.com/MIT-RLX/rlx.git",
    "https://github.com/MIT-RLX/rlx-models.git",
    # open_oura — the Oura ring BLE protocol and link layer (MIT).  Unpublished,
    # so it is pinned by `rev` in skill-devices/Cargo.toml rather than tracking
    # a branch.
    "https://github.com/Th0rgal/open_oura",
]
